name: "(Shared): Compute next version"

on:
  workflow_call:
    inputs:
      file_path:
        description: 'Path to JSON file containing the current version (jq will read .version)'
        required: false
        type: string
        default: package.json
      ref_name:
        description: 'Branch name (used to detect beta branches). If omitted, uses caller ref.'
        required: false
        type: string
        default: ''
      bump:
        description: 'Version type: patch, minor, major, or custom.'
        required: false
        type: string
        default: patch
      custom_version:
        description: 'Explicit version when bump=custom (leading v optional).'
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: 'Computed next version (e.g. 1.2.4 or 1.2.4-beta.1)'
        value: ${{ jobs.compute-version.outputs.version }}

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          FILE_PATH="${{ inputs.file_path }}"
          BRANCH_NAME="${{ inputs.ref_name }}"
          BUMP="${{ inputs.bump }}"
          CUSTOM="${{ inputs.custom_version }}"

          # custom: normalize (strip leading v/whitespace) and validate semver
          if [ "$BUMP" = "custom" ]; then
            V="$(echo "$CUSTOM" | tr -d '[:space:]')"
            V="${V#v}"; V="${V#V}"
            if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Invalid custom version: '$CUSTOM'"
              exit 1
            fi
            echo "::notice::Custom version: $V"
            echo "version=$V" >> $GITHUB_OUTPUT
            exit 0
          fi

          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "::error::Invalid version type: '$BUMP' (expected patch, minor, major, or custom)"; exit 1 ;;
          esac

          CURR=""
          if [ -f "$FILE_PATH" ]; then
            CURR=$(jq -r .version "$FILE_PATH" 2>/dev/null || true)
          fi
          if [ -z "$CURR" ]; then
            echo "::error::Could not determine current version from $FILE_PATH."
            exit 1
          fi

          if [[ $CURR =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-beta(\.([0-9]+))?)?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            PRERELEASE="${BASH_REMATCH[4]}"
            BETA_NUM="${BASH_REMATCH[6]}"
          else
            echo "::error::Version format is invalid: $CURR"
            exit 1
          fi

          case "$BUMP" in
            major) BASE="$((MAJOR+1)).0.0" ;;
            minor) BASE="${MAJOR}.$((MINOR+1)).0" ;;
            patch) BASE="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac

          if [[ "$BRANCH_NAME" == *beta* ]]; then
            # beta branch: patch continues the current beta line; minor/major open a new one
            if [ "$BUMP" = "patch" ] && [ -n "$PRERELEASE" ]; then
              VERSION="${MAJOR}.${MINOR}.${PATCH}-beta.$(( ${BETA_NUM:-0} + 1 ))"
            else
              VERSION="${BASE}-beta.1"
            fi
          else
            # non-beta branch: patch finalizes a pending beta; otherwise bump
            if [ "$BUMP" = "patch" ] && [ -n "$PRERELEASE" ]; then
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
            else
              VERSION="$BASE"
            fi
          fi

          echo "::notice::$CURR ($BUMP on ${BRANCH_NAME:-current}) -> $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
